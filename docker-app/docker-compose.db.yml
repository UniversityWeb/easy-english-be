version: '3.8'

services:
  easy-english-db:
    container_name: easy-english-db
    image: postgres:17.2
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - easy-english-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - easy-english-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "82:80"
    depends_on:
      easy-english-db:
        condition: service_healthy
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    networks:
      - easy-english-net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "redis123" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - easy-english-net
    restart: unless-stopped

  redisinsight:
    container_name: redisinsight
    image: redislabs/redisinsight:latest
    ports:
      - '5540:5540'
    networks:
      - easy-english-net
    restart: unless-stopped
    depends_on:
      - redis

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: minio
    environment:
      MINIO_ACCESS_KEY: ${PROD_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${PROD_MINIO_SECRET_KEY}
    ports:
      - "9000:9000" # File browser (API)
      - "9001:9001" # Web console
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - easy-english-net
    restart: unless-stopped

volumes:
  easy-english-data:
  redis_data:
  minio_data:

networks:
  easy-english-net:
    driver: bridge
